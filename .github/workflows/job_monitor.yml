name: Hardware Job Monitor

on:
  # Every 30 minutes during the Israel daytime; nothing overnight.
  # Cron is UTC; Israel is UTC+3 in summer (IDT) and UTC+2 in winter (IST).
  # 04:00-20:30 UTC = 07:00-23:30 in summer and 06:00-22:30 in winter, so BOTH
  # seasons get a run at 07:00 Israel time for the morning digest.
  # Anything found overnight is queued by the quiet-hours logic (00:00-07:00
  # Israel, DST-aware in main.py) and delivered in one digest at the 07:00 run.
  # Repo is public, so Actions minutes are unlimited and the window is not trimmed.
  # NOTE: GitHub may delay or skip scheduled runs under load; the 30-min cadence
  # is a best effort, not a guarantee.
  schedule:
    - cron: "0,30 4-20 * * *"
  # Allow manual triggering from GitHub Actions UI
  workflow_dispatch:
    inputs:
      init:
        description: "Run in --init mode (seed baseline, no notifications)"
        required: false
        type: boolean
        default: false
      test_notify:
        description: "Send a test WhatsApp notification"
        required: false
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit state files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch with a token that allows pushing back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor (init mode)
        if: ${{ github.event.inputs.init == 'true' }}
        env:
          CALLMEBOT_PHONE:   ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY:     ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:      ${{ secrets.GOOGLE_CSE_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:  ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM:        ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:          ${{ secrets.TWILIO_TO }}
        run: python main.py --init

      - name: Run monitor (test notify)
        if: ${{ github.event.inputs.test_notify == 'true' }}
        env:
          CALLMEBOT_PHONE:   ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY:     ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:      ${{ secrets.GOOGLE_CSE_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:  ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM:        ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:          ${{ secrets.TWILIO_TO }}
        run: python main.py --test-notify

      - name: Run monitor (normal)
        if: ${{ github.event.inputs.init != 'true' && github.event.inputs.test_notify != 'true' }}
        env:
          CALLMEBOT_PHONE:   ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY:     ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:      ${{ secrets.GOOGLE_CSE_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:  ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM:        ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:          ${{ secrets.TWILIO_TO }}
        run: python main.py

      - name: Commit state files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json pending_notifications.json || true
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore: update job state [skip ci]"
          git push
