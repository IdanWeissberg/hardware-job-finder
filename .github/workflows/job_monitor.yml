name: Hardware Job Monitor

on:
  # These cron slots only START the monitor; they do NOT set the cadence.
  # GitHub drops most scheduled triggers on shared runners (measured on this
  # repo: ~4 runs/day out of 34). So the job itself stays alive and rescans
  # every 30 minutes (see the loop in "Run monitor (normal)"). The many slots
  # below are a safety net: whenever a loop ends or is cancelled, the next
  # trigger restarts one, usually within a few hours.
  # Cron is UTC; Israel is UTC+3 (IDT) in summer, UTC+2 (IST) in winter.
  # 04:00-20:30 UTC = 07:00-23:30 summer / 06:00-22:30 winter, so both seasons
  # get a 07:00 Israel start for the morning digest. Overnight finds stay silent
  # via the quiet-hours logic in main.py and go out in the 07:00 digest.
  schedule:
    - cron: "0,30 4-20 * * *"
  # Allow manual triggering from GitHub Actions UI
  workflow_dispatch:
    inputs:
      init:
        description: "Run in --init mode (seed baseline, no notifications)"
        required: false
        type: boolean
        default: false
      test_notify:
        description: "Send a test WhatsApp notification"
        required: false
        type: boolean
        default: false

concurrency:
  # Only one monitor alive at a time. A new trigger replaces the running loop
  # instead of two jobs fighting over pushing the state file.
  group: job-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write   # needed to commit state files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch with a token that allows pushing back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor (init mode)
        if: ${{ github.event.inputs.init == 'true' }}
        env:
          CALLMEBOT_PHONE:   ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY:     ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:      ${{ secrets.GOOGLE_CSE_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:  ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM:        ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:          ${{ secrets.TWILIO_TO }}
        run: python main.py --init

      - name: Run monitor (test notify)
        if: ${{ github.event.inputs.test_notify == 'true' }}
        env:
          CALLMEBOT_PHONE:   ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY:     ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:      ${{ secrets.GOOGLE_CSE_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:  ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM:        ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:          ${{ secrets.TWILIO_TO }}
        run: python main.py --test-notify

      - name: Run monitor (normal)
        if: ${{ github.event.inputs.init != 'true' && github.event.inputs.test_notify != 'true' }}
        env:
          CALLMEBOT_PHONE:   ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY:     ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:      ${{ secrets.GOOGLE_CSE_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:  ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM:        ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:          ${{ secrets.TWILIO_TO }}
        run: |
          # GitHub's scheduler drops most cron triggers on shared runners
          # (measured: ~4 runs/day instead of 34). So we stop relying on it for
          # cadence: this single job stays alive and scans every 30 minutes by
          # itself, committing state after each pass so nothing is lost if the
          # runner is cancelled. Free because the repo is public.
          set +e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          INTERVAL=1800            # 30 minutes
          END=$(( $(date +%s) + 330*60 ))   # stop ~5.5h in, under the 6h job cap
          PASS=0
          while : ; do
            PASS=$((PASS+1))
            echo "::group::scan pass $PASS ($(date -u +%H:%M:%SZ))"
            python main.py
            git add seen_jobs.json pending_notifications.json
            if ! git diff --cached --quiet ; then
              git commit -m "chore: update job state [skip ci]"
              git pull --rebase --autostash origin main
              git push
            fi
            echo "::endgroup::"
            NOW=$(date +%s)
            if [ $(( END - NOW )) -lt $INTERVAL ] ; then
              echo "budget spent after $PASS pass(es); exiting so the next trigger starts a fresh loop"
              break
            fi
            sleep $INTERVAL
          done

      - name: Commit state files
        if: always()
        run: |
          # Safety net for the init / test-notify paths; the normal loop already
          # commits after every pass. Must never fail the job.
          set +e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json pending_notifications.json
          if ! git diff --cached --quiet ; then
            git commit -m "chore: update job state [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
          exit 0
