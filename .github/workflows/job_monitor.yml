name: Hardware Job Monitor

on:
  # Every ~2.5 hours during the Israel daytime (07:00–22:00), then nothing
  # overnight. Cron is UTC; Israel is UTC+3 in summer (IDT) and UTC+2 in winter
  # (IST). These slots are chosen so that in BOTH seasons there is a run at
  # ~07:00 Israel time (the morning digest) and roughly-2.5h spacing through the
  # day. Overnight jobs are queued by the quiet-hours logic (00:00–07:00 Israel,
  # DST-aware in main.py) and delivered as a single digest at the 07:00 run.
  # Summer (UTC+3) Israel times:  07:00 08:00 09:30 12:00 14:30 17:00 19:30 22:00
  # Winter (UTC+2) Israel times:  06:00 07:00 08:30 11:00 13:30 16:00 18:30 21:00
  schedule:
    - cron: "0 4 * * *"    # 07:00 IDT / 06:00 IST  (summer morning digest)
    - cron: "0 5 * * *"    # 08:00 IDT / 07:00 IST  (winter morning digest)
    - cron: "30 6 * * *"   # 09:30 IDT / 08:30 IST
    - cron: "0 9 * * *"    # 12:00 IDT / 11:00 IST
    - cron: "30 11 * * *"  # 14:30 IDT / 13:30 IST
    - cron: "0 14 * * *"   # 17:00 IDT / 16:00 IST
    - cron: "30 16 * * *"  # 19:30 IDT / 18:30 IST
    - cron: "0 19 * * *"   # 22:00 IDT / 21:00 IST
  # Allow manual triggering from GitHub Actions UI
  workflow_dispatch:
    inputs:
      init:
        description: "Run in --init mode (seed baseline, no notifications)"
        required: false
        type: boolean
        default: false
      test_notify:
        description: "Send a test WhatsApp notification"
        required: false
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit state files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch with a token that allows pushing back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor (init mode)
        if: ${{ github.event.inputs.init == 'true' }}
        env:
          CALLMEBOT_PHONE:   ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:  ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM:        ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:          ${{ secrets.TWILIO_TO }}
        run: python main.py --init

      - name: Run monitor (test notify)
        if: ${{ github.event.inputs.test_notify == 'true' }}
        env:
          CALLMEBOT_PHONE:   ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:  ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM:        ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:          ${{ secrets.TWILIO_TO }}
        run: python main.py --test-notify

      - name: Run monitor (normal)
        if: ${{ github.event.inputs.init != 'true' && github.event.inputs.test_notify != 'true' }}
        env:
          CALLMEBOT_PHONE:   ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:  ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM:        ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:          ${{ secrets.TWILIO_TO }}
        run: python main.py

      - name: Commit state files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json pending_notifications.json || true
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore: update job state [skip ci]"
          git push
