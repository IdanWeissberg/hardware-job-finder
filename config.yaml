# ---------- Quiet hours ----------
# No WhatsApp messages are sent between quiet_start and quiet_end (Israel time).
# Jobs found during this window are queued and sent in a digest after quiet_end.
quiet_hours:
  start: "00:00"
  end: "07:00"
  timezone: "Asia/Jerusalem"

# ---------- Notification settings ----------
notification:
  # Provider: "callmebot" or "twilio"
  provider: "callmebot"
  # Max jobs to list per WhatsApp message before truncating
  max_jobs_per_message: 20

# ---------- Companies ----------
# ats values:
#   workday        â€” POST to Workday CXS endpoint (needs workday_url + base_url)
#   greenhouse     â€” Greenhouse Job Board API (needs board)
#   lever          â€” Lever public postings API (needs company)
#   comeet         â€” Comeet public careers page (needs slug; optionally uid+token for API)
#   amazon         â€” Amazon.jobs JSON endpoint
#   apple          â€” Apple careers POST API
#   microsoft      â€” Microsoft careers API
#   smartrecruitersâ€” SmartRecruiters public postings API (needs company_id)
#   icims          â€” iCIMS jobs search (needs subdomain)
#   google         â€” Google careers scraper
#   eightfold      â€” Eightfold.ai API (needs domain)
#   workable       â€” Workable public apply API (needs slug)
#   scraper        â€” Generic HTML scraper (needs careers_url; set fragile: true)

